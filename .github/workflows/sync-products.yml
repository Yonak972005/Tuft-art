name: Sync products from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  sync-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download products CSV
        run: |
          curl --fail --location --silent --show-error "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOrtb890NBzVIpObAuVqlxUvxQuqC68hrkHSgkfuWkZyqGHEgPmKf5Dw5mnIUN-ePUo2yQhzVuCehx/pub?gid=0&single=true&output=csv&v=$(date +%s)" -o productos.csv.tmp
          product_count=$(tail -n +2 productos.csv.tmp | grep -c '[^[:space:]]' || true)
          if [ "$product_count" -lt 10 ]; then
            echo "La hoja debe contener al menos 10 productos. Se encontraron: $product_count"
            rm productos.csv.tmp
            exit 1
          fi
          mv productos.csv.tmp productos.csv

      - name: Commit updated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos.csv
          if git diff --cached --quiet; then
            echo "Google Sheets no tiene cambios nuevos."
          else
            git commit -m "Sync products from Google Sheets"
            git push
          fi
