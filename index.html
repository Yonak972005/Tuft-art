<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuft Art</title>

    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="Yonak97">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.tuftart.com/">
    <link rel="icon" type="image/png" href="images/tuft_redondo.png">


    <!-- Fuentes y estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Signika:wght@300..700&display=swap">    
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Signika:wght@300..700&display=swap">
    <meta name="google-site-verification" content="PK_WnyceKmknaoE79lSbeEOwpTBndgwT_k1p2chnJRY" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="sitemap.xml">
    
</head>
<body>

<div class="top-bar">
    <div class="top-redes">
        <a href="https://www.facebook.com/" target="_blank">
            <img src="https://cdn.simpleicons.org/facebook" alt="Facebook">
        </a>

        <a href="https://www.instagram.com/" target="_blank">
            <img src="https://cdn.simpleicons.org/instagram" alt="Instagram">
        </a>

        <a href="https://www.whatsapp.com/" target="_blank">
            <img src="https://cdn.simpleicons.org/whatsapp" alt="WhatsApp">
        </a>

        <p>Envios a todo Colombia</p>
            <img id="delivery-icon" src="https://www.svgrepo.com/show/480852/truck-delivery.svg" alt="Envíos">
    </div>

    <div class="left_logo">
        <img id="logo" src="images/tuft_redondo.png" alt="Tuft Art Logo">

        <div class="logo_text">
            <h1 class="logo_name">Tuft<span id="text_art">Art</span></h1>
            <p class="logo_slogan">Personaliza tu alfombra</p>
        </div>
    </div>
</div> 

<div class="banner">
    <img src="images/banner_tuftart.png" alt="Banner Tuft Art">

    <div class="banner-content">
        <h2>Personaliza tu alfombra</h2>
        <button>personaliza la tuya →</button>
        <div class="description">
            <p>Alfobras personalizadas con la imagen, logo o diseño que te guste.</p>
        </div>
    </div>
</div>
